name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - run: pnpm check:ddl
      - run: pnpm check:entitlements
      - run: pnpm check:permissions
      - run: pnpm check:degraded
      - run: pnpm check:class-denylist
      - run: pnpm typecheck
      # Package/unit tests only — pms-core is sharded separately (singleWorker + shared D1).
      - run: pnpm exec turbo run test --filter=!@hospai/pms-core
      - run: pnpm lint

  test-pms-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      # Do not put `--` before --shard: pnpm forwards a bare `--`, and vitest
      # then treats --shard as a file filter — every matrix job runs the full suite.
      - run: pnpm --filter @hospai/pms-core run test --shard=${{ matrix.shard }}/3
