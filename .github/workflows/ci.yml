name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - run: pnpm check:ddl
      - run: pnpm check:entitlements
      - run: pnpm check:permissions
      - run: pnpm check:class-denylist
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
