name: Staging Deploy

on:
  workflow_dispatch:
    inputs:
      smoke_user_id:
        description: 'Clerk user ID (user_...) to smoke as; mints a fresh session token in-job. Leave empty for deploy-only.'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Build (staging SPA with Clerk)
        env:
          VITE_USE_DEV_ACTOR: '0'
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_ORG_ID: ${{ vars.VITE_ORG_ID }}
          VITE_PROPERTY_ID: ${{ vars.VITE_PROPERTY_ID }}
        run: pnpm build
      - name: Configure wrangler secrets
        working-directory: apps/pms-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "${{ secrets.CLERK_SECRET_KEY }}" | npx wrangler secret put CLERK_SECRET_KEY --env staging
          printf '%s' "${{ secrets.HOSPAI_ORG_MASTER_KEY }}" | npx wrangler secret put HOSPAI_ORG_MASTER_KEY --env staging
      - name: Apply D1 migrations (remote)
        working-directory: apps/pms-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply hospai-platform-staging --env staging --remote
      - name: Deploy staging Worker
        working-directory: apps/pms-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
      - name: Mint fresh Clerk session JWT
        if: inputs.smoke_user_id != ''
        id: jwt
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          SMOKE_USER_ID: ${{ inputs.smoke_user_id }}
        run: |
          set -euo pipefail
          SESSION=$(curl -sf -X POST "https://api.clerk.com/v1/sessions" \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"user_id\":\"$SMOKE_USER_ID\"}")
          SESSION_ID=$(printf '%s' "$SESSION" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).id))")
          TOKEN=$(curl -sf -X POST "https://api.clerk.com/v1/sessions/$SESSION_ID/tokens" \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          JWT=$(printf '%s' "$TOKEN" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).jwt))")
          echo "CLERK_SESSION_JWT=$JWT" >> "$GITHUB_OUTPUT"
      - name: Smoke test (optional)
        if: inputs.smoke_user_id != ''
        env:
          BASE: https://hospai-pms-core-staging.hospai.workers.dev
          CLERK_SESSION_JWT: ${{ steps.jwt.outputs.CLERK_SESSION_JWT }}
        run: pnpm smoke:staging
