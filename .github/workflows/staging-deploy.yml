name: Staging Deploy

on:
  workflow_dispatch:
    inputs:
      clerk_session_jwt:
        description: 'Clerk session JWT for post-deploy smoke (leave empty for deploy-only)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - name: Configure wrangler secrets
        working-directory: apps/pms-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "${{ secrets.CLERK_SECRET_KEY }}" | npx wrangler secret put CLERK_SECRET_KEY --env staging
          printf '%s' "${{ secrets.HOSPAI_ORG_MASTER_KEY }}" | npx wrangler secret put HOSPAI_ORG_MASTER_KEY --env staging
      - name: Apply D1 migrations (remote)
        working-directory: apps/pms-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply hospai-platform-staging --env staging --remote
      - name: Deploy staging Worker
        working-directory: apps/pms-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
      - name: Smoke test (optional)
        if: inputs.clerk_session_jwt != ''
        env:
          BASE: https://hospai-pms-core-staging.hospai.workers.dev
          CLERK_SESSION_JWT: ${{ inputs.clerk_session_jwt }}
        run: pnpm smoke:staging
