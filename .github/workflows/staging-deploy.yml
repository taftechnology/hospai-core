name: Staging Deploy

# Repo variable STAGING_SMOKE_USER_ID: Clerk user_… for default post-deploy smoke when smoke_user_id input is empty.

on:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: 'Run post-deploy HTTP smoke (default on). Set false for deploy-only.'
        required: false
        type: boolean
        default: true
      smoke_user_id:
        description: 'Clerk user ID (user_...) to smoke as; overrides vars.STAGING_SMOKE_USER_ID when set.'
        required: false
        type: string
      skip_ci_check:
        description: 'Emergency bypass — deploy without green CI on this SHA (default false).'
        required: false
        type: boolean
        default: false

jobs:
  verify-ci-green:
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_ci_check }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require green CI on this SHA
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const workflows = await github.rest.actions.listRepoWorkflows({ owner, repo });
            const ci = workflows.data.workflows.find(w => w.path === '.github/workflows/ci.yml' || w.name === 'CI');
            if (!ci) {
              core.setFailed('CI workflow (ci.yml) not found');
              return;
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: ci.id, head_sha: sha, status: 'completed', per_page: 20,
            });
            const green = runs.data.workflow_runs.some(r => r.conclusion === 'success');
            if (!green) {
              core.setFailed(
                `No successful CI run on ${sha}. Push/merge and wait for CI green before staging deploy. ` +
                `https://github.com/${owner}/${repo}/actions`
              );
            }

  deploy:
    runs-on: ubuntu-latest
    needs: verify-ci-green
    env:
      # Staging origin: smoke target and the Origin used when minting the session JWT (azp).
      BASE: https://hospai-pms-core-staging.hospai.workers.dev
    if: ${{ !cancelled() && (needs.verify-ci-green.result == 'success' || needs.verify-ci-green.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: CI gate bypass warning
        if: inputs.skip_ci_check
        run: echo "::warning::CI gate was bypassed (skip_ci_check=true). Deploy proceeding without green CI on this SHA."
      - name: Resolve smoke user id
        if: inputs.run_smoke == true
        id: smoke_user
        run: |
          set -euo pipefail
          INPUT="${{ inputs.smoke_user_id }}"
          VAR="${{ vars.STAGING_SMOKE_USER_ID }}"
          if [ -n "$INPUT" ]; then
            echo "id=$INPUT" >> "$GITHUB_OUTPUT"
          elif [ -n "$VAR" ]; then
            echo "id=$VAR" >> "$GITHUB_OUTPUT"
          else
            echo "::error::run_smoke=true but no smoke user id. Set repo variable STAGING_SMOKE_USER_ID or pass smoke_user_id input."
            exit 1
          fi
      - name: Build (staging SPA with Clerk)
        env:
          VITE_USE_DEV_ACTOR: '0'
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_ORG_ID: ${{ vars.VITE_ORG_ID }}
          VITE_PROPERTY_ID: ${{ vars.VITE_PROPERTY_ID }}
        run: pnpm build
      - name: Configure wrangler secrets
        working-directory: apps/pms-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "${{ secrets.CLERK_SECRET_KEY }}" | npx wrangler secret put CLERK_SECRET_KEY --env staging
          printf '%s' "${{ secrets.HOSPAI_ORG_MASTER_KEY }}" | npx wrangler secret put HOSPAI_ORG_MASTER_KEY --env staging
      - name: Apply D1 migrations (remote)
        working-directory: apps/pms-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply hospai-platform-staging --env staging --remote
      - name: Deploy staging Worker
        working-directory: apps/pms-core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
      # HospAI Ops Console (R7.1). After pms-core, because its PMS_OPS service binding needs
      # OpsEntrypoint to exist. Rebuilt on its own: the root build above bakes the HOTEL Clerk key
      # into every SPA, and the console must carry the OPS instance's key (publishable, so it is
      # written here; it matches apps/web-admin/wrangler.jsonc env.staging). Skipped with a warning
      # until the repo secret OPS_CLERK_SECRET_KEY (the ops instance's secret key) exists.
      - name: Check Ops Console secret
        id: ops_console
        env:
          OPS_CLERK_SECRET_KEY: ${{ secrets.OPS_CLERK_SECRET_KEY }}
        run: |
          if [ -n "$OPS_CLERK_SECRET_KEY" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::OPS_CLERK_SECRET_KEY is not set; the Ops Console was not deployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Ops Console (ops Clerk instance)
        if: steps.ops_console.outputs.deploy == 'true'
        env:
          VITE_USE_DEV_OPERATOR: '0'
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_cGVhY2VmdWwtbGVtdXItMTg3OS5jbGVyay5hY2NvdW50cy5kZXYk
        run: pnpm --filter @hospai/web-admin build
      - name: Deploy Ops Console
        if: steps.ops_console.outputs.deploy == 'true'
        working-directory: apps/web-admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPS_CLERK_SECRET_KEY: ${{ secrets.OPS_CLERK_SECRET_KEY }}
        run: |
          npx wrangler deploy --env staging
          printf '%s' "$OPS_CLERK_SECRET_KEY" | npx wrangler secret put CLERK_SECRET_KEY --env staging
      # Why this goes through the Clerk Frontend API (FAPI) and not the Backend API:
      # `azp` is set from the Origin header of a FAPI request. Session tokens minted
      # via BAPI (/v1/sessions/:id/tokens) carry no `azp`, and the Worker fails closed
      # on a missing `azp` (CLERK_AUTHORIZED_PARTIES), so those tokens get 401.
      # Flow: BAPI sign-in ticket -> FAPI sign-in with Origin = staging origin -> session JWT.
      # The dev-browser call exists only because staging uses a Clerk *development*
      # instance (FAPI there requires a dev-browser token); a production instance
      # would skip it.
      - name: Mint fresh Clerk session JWT
        if: inputs.run_smoke == true
        id: jwt
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          SMOKE_USER_ID: ${{ steps.smoke_user.outputs.id }}
        run: |
          set -euo pipefail
          # JSON field extraction: json_get <dot.path>; prints nothing when absent.
          json_get() {
            node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{let v=JSON.parse(d);for(const k of process.argv[1].split('.'))v=v?.[k];if(v!=null)console.log(v)}catch{}})" "$1"
          }
          # FAPI host = base64 payload of the publishable key (pk_test_/pk_live_), minus trailing '$'.
          FAPI_HOST=$(printf '%s' "$CLERK_PUBLISHABLE_KEY" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const p=d.trim().replace(/^pk_(test|live)_/,'');console.log(Buffer.from(p,'base64').toString('utf8').split(String.fromCharCode(36))[0])})")
          if [ -z "$FAPI_HOST" ]; then
            echo "::error::Could not derive the Clerk Frontend API host from VITE_CLERK_PUBLISHABLE_KEY."
            exit 1
          fi

          # 1. BAPI: one-time sign-in ticket for the smoke user.
          TICKET_RES=$(curl -sf -X POST "https://api.clerk.com/v1/sign_in_tokens" \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"user_id\":\"$SMOKE_USER_ID\",\"expires_in_seconds\":300}")
          TICKET=$(printf '%s' "$TICKET_RES" | json_get token)
          if [ -z "$TICKET" ]; then
            echo "::error::Clerk BAPI sign_in_tokens returned no ticket."
            exit 1
          fi
          echo "::add-mask::$TICKET"

          # 2. FAPI: dev-browser token (development instances only).
          DB_RES=$(curl -sf -X POST "https://$FAPI_HOST/v1/dev_browser" \
            -H "Origin: $BASE")
          DB_TOKEN=$(printf '%s' "$DB_RES" | json_get token)
          if [ -z "$DB_TOKEN" ]; then
            echo "::error::Clerk FAPI dev_browser returned no token."
            exit 1
          fi
          echo "::add-mask::$DB_TOKEN"

          # 3. FAPI: ticket sign-in with Origin = staging origin, so the JWT gets azp = $BASE.
          SIGNIN_RES=$(curl -sf -X POST "https://$FAPI_HOST/v1/client/sign_ins?__clerk_db_jwt=$DB_TOKEN" \
            -H "Origin: $BASE" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "strategy=ticket" \
            --data-urlencode "ticket=$TICKET")
          STATUS=$(printf '%s' "$SIGNIN_RES" | json_get response.status)
          if [ "$STATUS" != "complete" ]; then
            echo "::error::Clerk FAPI sign-in did not complete (status: ${STATUS:-none})."
            exit 1
          fi
          JWT=$(printf '%s' "$SIGNIN_RES" | json_get client.sessions.0.last_active_token.jwt)
          if [ -z "$JWT" ]; then
            echo "::error::Clerk FAPI sign-in completed but returned no session JWT."
            exit 1
          fi
          echo "::add-mask::$JWT"
          echo "CLERK_SESSION_JWT=$JWT" >> "$GITHUB_OUTPUT"
      - name: Smoke test (optional)
        if: inputs.run_smoke == true
        env:
          CLERK_SESSION_JWT: ${{ steps.jwt.outputs.CLERK_SESSION_JWT }}
        run: pnpm smoke:staging
